[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpulse-sdk"
version = "1.0.0"
description = "LogPulse Python SDK for structured log ingestion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
flask = ["flask>=2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
