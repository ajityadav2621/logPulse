# LogPulse — full stack: Postgres (users/auth), Mongo (log documents),
# the Go backend, the React frontend, and an edge nginx reverse proxy.
#
# Usage:
#   cd deployment
#   cp .env.example .env      # then edit secrets (JWT_SECRET, OAuth creds, admin password)
#   docker compose up -d --build
#   docker compose logs -f logpulse-backend
#
# This file is intentionally separate from backend/ and frontend/ — it only
# orchestrates the already-built images (see backend/Dockerfile and
# frontend/Dockerfile). Source code and deployment concerns don't mix.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

networks:
  logpulse-net:
    driver: bridge

volumes:
  pg_data:
  mongo_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-logpulse}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [logpulse-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logpulse} -d ${POSTGRES_DB:-logpulse}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging
    # Not published to the host by default — only the backend needs it.
    # Uncomment for local psql access during development.
    # ports: ["5432:5432"]

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [logpulse-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging
    # ports: ["27017:27017"]

  logpulse-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: logpulse-backend:latest
    container_name: logpulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      POSTGRES_DSN: "host=postgres user=${POSTGRES_USER:-logpulse} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-logpulse} port=5432 sslmode=disable"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: ${MONGO_DB:-logpulse}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-http://localhost:8080/api/auth/github/callback}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@logpulse.io}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-LogPulse}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-logpulse.notification@gmail.com}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ANOMALY_INTERVAL_SECONDS: ${ANOMALY_INTERVAL_SECONDS:-120}
    networks: [logpulse-net]
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  logpulse-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-http://localhost:3001}
    image: logpulse-frontend:latest
    container_name: logpulse-frontend
    restart: unless-stopped
    depends_on:
      logpulse-backend:
        condition: service_healthy
    networks: [logpulse-net]
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    logging: *default-logging

  logpulse-docs:
    image: nginx:1.27-alpine
    container_name: logpulse-docs
    restart: unless-stopped
    volumes:
      - ../docs-site/build:/usr/share/nginx/html:ro
      - ./nginx/docs.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [logpulse-net]
    ports:
      - "${DOCS_HOST_PORT:-3001}:80"
    logging: *default-logging

  # Optional single entrypoint (TLS termination + reverse proxy to the two
  # services above on one port). Skip this and hit logpulse-frontend /
  # logpulse-backend's own published ports directly for local dev; use this
  # for anything resembling a real deployment.
  nginx:
    image: nginx:1.27-alpine
    container_name: logpulse-nginx
    restart: unless-stopped
    depends_on:
      - logpulse-backend
      - logpulse-frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # mount TLS certs here, see nginx.conf's HTTPS block
    networks: [logpulse-net]
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      # - "${EDGE_HTTPS_PORT:-443}:443"
    logging: *default-logging
    profiles: ["edge"]   # `docker compose --profile edge up -d` to include it
