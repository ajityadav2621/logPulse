server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Search data.
    location /search/ {
        expires 1h;
    }

    # Redirect /docs/ directory to /docs/intro/.
    location = /docs/ {
        return 301 /docs/intro/;
    }

    # Category page without index.html: redirect to first sub-page.
    location = /docs/getting-started/ {
        return 301 /docs/getting-started/installation/;
    }

    location /docs/ {
        try_files $uri $uri/ /docs/intro/index.html;
    }

    # API reference is under /docs/ in the build.
    location /api-reference {
        return 301 http://$http_host/docs/api-reference/;
    }

    # SPA fallback for Docusaurus routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
