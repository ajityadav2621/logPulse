# LogPulse — outer edge nginx.
#
# Single entrypoint for the whole stack: terminates TLS and reverse-proxies
# to the two internal containers on the compose network. This is separate
# from frontend/nginx.spa.conf, which only serves the built SPA inside the
# logpulse-frontend container and knows nothing about /api, /ws, or TLS.
#
#   browser
#     -> :80/:443 (this nginx, container: logpulse-nginx)
#          /api, /ws  -> logpulse-backend:8080
#          everything else -> logpulse-frontend:80
#
# For local/dev use, docker-compose.yml exposes the frontend and backend
# ports directly and this container is optional — see deployment/README.md.

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream logpulse_backend {
        server logpulse-backend:8080;
    }

    upstream logpulse_frontend {
        server logpulse-frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Uncomment once TLS certs are mounted (see docker-compose.yml
        # comments) to redirect all plain HTTP to HTTPS instead of serving
        # the app directly on :80.
        # return 301 https://$host$request_uri;

        location /api/ {
            proxy_pass http://logpulse_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://logpulse_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /health {
            proxy_pass http://logpulse_backend;
        }

        location / {
            proxy_pass http://logpulse_frontend;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server — enable once server.crt/server.key exist under
    # deployment/nginx/certs/ (see deployment/scripts/deploy.sh).
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     location /api/ { proxy_pass http://logpulse_backend; }
    #     location /ws/  { proxy_pass http://logpulse_backend; proxy_http_version 1.1;
    #                      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    #     location /     { proxy_pass http://logpulse_frontend; }
    # }
}
