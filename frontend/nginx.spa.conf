server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: cache aggressively, filenames are content-hashed by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket stream proxy to backend (gorilla/websocket upgrade).
    location /ws/ {
        proxy_pass http://logpulse-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Client-side routing (React Router) — always fall back to index.html
    # for any path that isn't a real file, so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
